# More option see https://github.com/DreamMaoMao/mango/wiki/


source=~/.config/mango/inputs.conf
source=~/.config/mango/keybinds.conf
source=~/.config/mango/monitor.conf
source=~/.config/mango/noctalia.conf
source=~/.config/mango/theming.conf
source=~/.config/mango/overview.conf

#Application binds
source=~/.config/mango/application.conf

# Layout Tweaks
source=~/.config/mango/master.conf
source=~/.config/mango/scroller.conf

bind=SUPER,r,reload_config

bind=SUPER+SHIFT,T,setlayout,tile
bind=SUPER+SHIFT,S,setlayout,scroller

circle_layout=tile # Stupid name, Cycles between selected layouts

bind=SUPER,P,incnmaster,+1
bind=SUPER,O,incnmaster,-1


# Float the “Confirm to replace files” dialog and file operation progress window
windowrule=appid:Thunar,title:Confirm to replace files,isfloating:1
windowrule=appid:Thunar,title:File Operation Progress,isfloating:1


# layout support: tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile


